<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f78">
  <title>Studentato 1 — Porto Fiumicino 2026</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #173f78;
      --blue-deep: #102d56;
      --blue-soft: #eaf1fa;
      --ink: #17263a;
      --muted: #64748b;
      --paper: #ffffff;
      --line: #e2eaf4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #dce9f8 0, transparent 55%),
        #f4f7fb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 54px);
      background: var(--paper);
      border: 1px solid rgba(23, 63, 120, .09);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(25, 52, 89, .11);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: .74rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--blue-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: .015em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .divider {
      height: 1px;
      margin: 30px 0 22px;
      background: var(--line);
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .portal-link {
      min-height: 72px;
      padding: 15px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .portal-link:hover {
      transform: translateY(-2px);
      background: #f8faff;
      border-color: #b8cbe4;
    }

    .portal-link:focus-visible,
    .copy-link:focus-visible {
      outline: 3px solid #8eb6e9;
      outline-offset: 3px;
    }

    .link-title {
      display: block;
      color: var(--blue-deep);
      font-weight: 700;
      line-height: 1.35;
    }

    .link-detail {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .83rem;
      line-height: 1.4;
    }

    .arrow {
      flex: 0 0 auto;
      color: var(--blue);
      font-size: 1.2rem;
    }

    .footer {
      margin: 22px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .82rem;
    }

    .copy-link {
      padding: 8px 11px;
      color: var(--blue);
      background: var(--blue-soft);
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .copy-link:hover { background: #dce8f7; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Figli di Santa Maria Immacolata</p>
    <h1>Studentato 1</h1>
    <p class="subtitle">Porto Fiumicino 2026</p>

    <div class="divider" aria-hidden="true"></div>

    <nav class="links" aria-label="Student portal links">
      <a class="portal-link"
         href="https://compendio.congregazionefsmi.workers.dev"
         target="_blank" rel="noopener noreferrer">
        <span>
          <span class="link-title">Compendio</span>
          <span class="link-detail">Prayer-Songbook</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="portal-link"
         href="https://congregazionefsmi.github.io/orario"
         target="_blank" rel="noopener noreferrer">
        <span>
          <span class="link-title">Orario</span>
          <span class="link-detail">Liturgia · Cucina · Assistente · Teologia</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="portal-link"
         href="https://congregazionefsmi.github.io/documentistudenti"
         target="_blank" rel="noopener noreferrer">
        <span>
          <span class="link-title">Documenti Studenti</span>
          <span class="link-detail">Google Log-in</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="portal-link"
         href="https://shmiphilippines.netlify.app"
         target="_blank" rel="noopener noreferrer">
        <span>
          <span class="link-title">SHMI Philippines</span>
          <span class="link-detail">Visit the Philippines portal</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="portal-link"
         href="https://congregazionefsmi.github.io/dirittocanonico/"
         target="_blank" rel="noopener noreferrer">
        <span>
          <span class="link-title">Diritto Canonico</span>
          <span class="link-detail">Canon Law</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <div class="footer">
      <span>Studentato 1 · Porto Fiumicino</span>
      <button class="copy-link" type="button" id="copyLink">Copy portal link</button>
    </div>
  </main>

  <script>
    document.getElementById("copyLink").addEventListener("click", async () => {
      const button = document.getElementById("copyLink");
      try {
        await navigator.clipboard.writeText(window.location.href);
        button.textContent = "Link copied";
        setTimeout(() => button.textContent = "Copy portal link", 1800);
      } catch {
        button.textContent = "Copy unavailable";
        setTimeout(() => button.textContent = "Copy portal link", 1800);
      }
    });
  </script>
</body>
</html>

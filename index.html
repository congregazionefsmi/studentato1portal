<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figli di Santa Maria Immacolata – Studentato 1</title>
  <style>
    :root {
      --marian-blue: #9fd0f5;
      --marian-mid: #7fbcf0;
      --marian-light: #cfe8fb;
      --marian-soft: #f4faff;
      --marian-text: #3a7bbf;
      --gold: #c9a227;
      --text: #2f5d8a;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #fbfdff 0%, var(--marian-soft) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
    }

    .section-title {
      text-align: center;
      color: var(--marian-text);
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2.2rem;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    /* Each app is one square tile (the link itself) */
    .app {
      width: 100%;
      max-width: 170px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1rem;
      text-decoration: none;
      color: #1e4f7d;
      text-align: center;
      border-radius: 26px;
      background: linear-gradient(145deg, #ffffff 0%, var(--marian-light) 50%, var(--marian-blue) 100%);
      box-shadow: 0 10px 22px rgba(127, 188, 240, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .app:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px rgba(127, 188, 240, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .app:active { transform: scale(0.96); }

    .app:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .app .emoji {
      font-size: 2.6rem;
      line-height: 1;
    }

    .app .name {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .app .desc {
      font-size: 0.72rem;
      color: var(--marian-text);
      line-height: 1.3;
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      color: var(--marian-text);
      font-size: 0.8rem;
      padding: 1.5rem 1rem;
    }

    footer strong { color: var(--marian-text); }

    @media (max-width: 480px) {
      main { padding-top: 2.2rem; }
      .apps { grid-template-columns: repeat(2, 1fr); gap: 1.1rem; }
      .app { border-radius: 22px; }
    }
  </style>
</head>
<body>

  <main>
    <h2 class="section-title">Figli di Santa Maria Immacolata</h2>

    <nav class="apps">

      <a class="app" href="https://compendio.congregazionefsmi.workers.dev" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🙏</span>
        <span class="name">Compendio</span>
        <span class="desc">Prayer &amp; Songbook</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/orario" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🗓️</span>
        <span class="name">Orario</span>
        <span class="desc">Liturgia · Cucina<br>Assistente · Teologia</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/documentistudenti" target="_blank" rel="noopener noreferrer">
        <span class="emoji">📂</span>
        <span class="name">Documenti Studenti</span>
        <span class="desc">Google Sign-in</span>
      </a>

      <a class="app" href="https://shmiphilippines.netlify.app" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🌏</span>
        <span class="name">SHMI Philippines</span>
        <span class="desc">Province website</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/dirittocanonico/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">⚖️</span>
        <span class="name">Diritto Canonico</span>
        <span class="desc">Canon law materials</span>
      </a>

    </nav>
  </main>

  <footer>
    <p><strong>Studentato 1</strong> · Porto Fiumicino 2026</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figli di Santa Maria Immacolata – Studentato 1</title>
  <style>
    :root {
      --marian-light: #e6f3fd;
      --marian-blue: #bfe0fa;
      --marian-accent: #8cc6f2;
      --marian-text: #3a7bbf;
      --marian-dark: #2a5f94;
      --gold: #c9a227;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      color: var(--marian-dark);
      background: linear-gradient(180deg, #ffffff 0%, var(--marian-light) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 3rem;
    }

    /* ---------- Title block ---------- */
    .title-block {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .title-block h1 {
      font-size: clamp(1.05rem, 3vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--marian-dark);
    }

    .title-block .meta {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--marian-text);
      letter-spacing: 0.03em;
    }

    .title-block .meta span + span::before {
      content: "•";
      margin: 0 0.6rem;
      color: var(--marian-accent);
    }

    /* ---------- App grid ---------- */
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    /* Each app is one square tile (the link itself) */
    .app {
      width: 100%;
      max-width: 170px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      text-decoration: none;
      color: var(--marian-dark);
      text-align: center;
      border-radius: 24px;
      background: var(--white);
      border: 1px solid #d6eafb;
      box-shadow: 0 4px 14px rgba(140, 198, 242, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .app:hover {
      transform: translateY(-3px);
      background: var(--marian-blue);
      box-shadow: 0 10px 24px rgba(140, 198, 242, 0.4);
    }

    .app:active { transform: scale(0.97); }

    .app:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .app .emoji {
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 0.2rem;
    }

    .app .name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .app .desc {
      font-size: 0.72rem;
      color: var(--marian-text);
      line-height: 1.3;
    }

    @media (max-width: 480px) {
      main { padding-top: 2.5rem; }
      .apps { grid-template-columns: repeat(2, 1fr); gap: 1.1rem; }
      .app { border-radius: 20px; }
    }
  </style>
</head>
<body>

  <main>
    <header class="title-block">
      <h1>Figli di Santa Maria Immacolata</h1>
      <p class="meta">
        <span>Studentato 1</span>
        <span>2026 Porto, Fiumicino</span>
      </p>
    </header>

    <nav class="apps">

      <a class="app" href="https://compendio.congregazionefsmi.workers.dev" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🙏</span>
        <span class="name">Compendio</span>
        <span class="desc">Prayer &amp; Songbook</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/orario" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🗓️</span>
        <span class="name">Orario</span>
        <span class="desc">Liturgia · Cucina<br>Assistente · Teologia</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/documentistudenti" target="_blank" rel="noopener noreferrer">
        <span class="emoji">📂</span>
        <span class="name">Documenti Studenti</span>
        <span class="desc">Google Sign-in</span>
      </a>

      <a class="app" href="https://shmiphilippines.netlify.app" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🌏</span>
        <span class="name">SHMI Philippines</span>
        <span class="desc">Province website</span>
      </a>

      <a class="app" href="https://congregazionefsmi.github.io/dirittocanonico/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">⚖️</span>
        <span class="name">Diritto Canonico</span>
        <span class="desc">Canon law materials</span>
      </a>

    </nav>
  </main>

</body>
</html>
